name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Test timing logic
        run: npm test

      - name: Bundle device bridge
        run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.0.${{ github.run_number }}\"/" android/app/build.gradle

      - name: App icon (CPR pictogram, all sizes incl. adaptive)
        run: |
          rm -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml android/app/src/main/res/drawable/ic_launcher_background.xml android/app/src/main/res/values/ic_launcher_background.xml
          cp -r android-res/* android/app/src/main/res/
          sed -i 's#<item name="android:background">@drawable/splash</item>#<item name="android:background">@drawable/splash</item>\n        <item name="windowSplashScreenBackground">\#060B18</item>#' android/app/src/main/res/values/styles.xml
          grep -n "windowSplashScreenBackground" android/app/src/main/res/values/styles.xml
          ls android/app/src/main/res/mipmap-anydpi-v26/

      - name: Sync web app into Android
        run: npx cap sync android

      - name: Signing key from the repository secret (same key every build, so updates install over the old app)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::Add the KEYSTORE_B64 secret (Settings > Secrets and variables > Actions). Not building with a random key."; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/app.keystore"
          python3 - <<'PY'
          import os, re
          p = 'android/app/build.gradle'; s = open(p).read()
          ks = os.environ['RUNNER_TEMP'] + '/app.keystore'
          cfg = "\n    signingConfigs {\n        debug {\n            storeFile file('%s')\n            storePassword 'android'\n            keyAlias 'androiddebugkey'\n            keyPassword 'android'\n        }\n    }\n" % ks
          s = re.sub(r'^android \{', 'android {' + cfg, s, count=1, flags=re.M)
          open(p, 'w').write(s)
          PY
          grep -c "signingConfigs" android/app/build.gradle

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../CodeBlue.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CodeBlue-apk
          path: CodeBlue.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Code Blue 1.0.${{ github.run_number }}
          body: "Download **CodeBlue.apk** below and open it on your Android phone to install."
          files: CodeBlue.apk
          make_latest: true
